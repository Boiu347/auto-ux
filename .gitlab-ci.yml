stages:
  - validate
  - deploy

default:
  interruptible: true

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

validate_project:
  stage: validate
  image: python:3.12
  script:
    - python3 -m unittest discover -s tests
    - python3 -m py_compile app.py
    - |
      python3 - <<'PY'
      import json
      import os
      import pathlib
      import re

      root = pathlib.Path.cwd()
      manifest = json.loads((root / "monitor.yaml").read_text(encoding="utf-8"))
      runtime = (manifest.get("runtime") or {}).get("type")
      preview = manifest.get("preview") or {}
      production = manifest.get("production") or {}
      checks = {
          "id": manifest.get("id") == "auto-ux",
          "repository": manifest.get("repo") == os.environ["CI_PROJECT_PATH"],
          "production path": manifest.get("path") == "/auto-ux/",
          "temporary production auth": manifest.get("auth", {}).get("mode") == "public",
          "runtime": runtime == "service",
          "preview runtime": preview.get("runtime") == runtime,
          "preview path": preview.get("path") == "/_preview/auto-ux/",
          "preview auth": preview.get("auth_project_id") == "auto-ux-preview",
          "production enabled": production.get("enabled") is True,
          "production rollout": production.get("rollout") == "auto-after-main",
          "health path": (manifest.get("runtime") or {}).get("health_path") == "/health",
      }
      dockerfile = (root / "Dockerfile").read_text(encoding="utf-8")
      checks["docker healthcheck"] = bool(re.search(r"^\s*HEALTHCHECK\b", dockerfile, re.I | re.M))
      failed = [name for name, passed in checks.items() if not passed]
      if failed:
          raise SystemExit("invalid NX deployment contract: " + ", ".join(failed))
      print("validated domainless Web auto-ux (service)")
      PY

.nx_deploy:
  stage: deploy
  image: python:3.12-alpine
  interruptible: false
  before_script:
    - apk add --no-cache openssh-client
    - install -d -m 0700 "$HOME/.ssh"
    - |
      package_project() {
        python3 - "$1" <<'PY'
      import json
      import pathlib
      import tarfile
      import sys

      root = pathlib.Path.cwd()
      output = pathlib.Path(sys.argv[1]).resolve()
      manifest = json.loads((root / "monitor.yaml").read_text(encoding="utf-8"))
      excluded_parts = {".git", ".venv", "__pycache__", "logs"}
      runtime_dirs = {
          pathlib.PurePosixPath(value).as_posix().rstrip("/")
          for value in manifest.get("runtime_data_dirs", [])
      }
      with tarfile.open(output, "w:gz", format=tarfile.PAX_FORMAT) as archive:
          for path in sorted(root.rglob("*")):
              if path.resolve() == output:
                  continue
              relative = pathlib.PurePosixPath(path.relative_to(root).as_posix())
              value = relative.as_posix()
              if any(part in excluded_parts for part in relative.parts):
                  continue
              if any(value == item or value.startswith(item + "/") for item in runtime_dirs):
                  continue
              if path.is_symlink():
                  raise SystemExit(f"deployment package rejects symlink: {relative}")
              if path.is_file():
                  archive.add(path, arcname=value, recursive=False)
      PY
      }

deploy_preview:
  extends: .nx_deploy
  resource_group: "$CI_PROJECT_PATH_SLUG-preview"
  environment:
    name: preview/$CI_PROJECT_PATH_SLUG
    url: https://wowdata.guanghexinzhi.cn/_preview/auto-ux/
  script:
    - install -m 0600 "$PREVIEW_DEPLOY_KEY" "$HOME/.ssh/id_ed25519"
    - printf '%s\n' "$PREVIEW_DEPLOY_HOST_KEY" > "$HOME/.ssh/known_hosts"
    - chmod 0600 "$HOME/.ssh/known_hosts"
    - package_project nx-project.tar.gz
    - |
      ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
        -o StrictHostKeyChecking=yes "$PREVIEW_DEPLOY_USER@$PREVIEW_DEPLOY_HOST" \
        "preview auto-ux $CI_COMMIT_SHA $CI_MERGE_REQUEST_IID service" \
        < nx-project.tar.gz
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $PREVIEW_DEPLOY_KEY != "" && $PREVIEW_DEPLOY_HOST != "" && $PREVIEW_DEPLOY_USER != "" && $PREVIEW_DEPLOY_HOST_KEY != ""'
  needs: [validate_project]

deploy_production:
  extends: .nx_deploy
  resource_group: "$CI_PROJECT_PATH_SLUG-production"
  environment:
    name: production
    url: $WOWDATA_PRODUCTION_URL
    deployment_tier: production
  script:
    - install -m 0600 "$PRODUCTION_DEPLOY_KEY" "$HOME/.ssh/id_ed25519"
    - printf '%s\n' "$PRODUCTION_DEPLOY_HOST_KEY" > "$HOME/.ssh/known_hosts"
    - chmod 0600 "$HOME/.ssh/known_hosts"
    - package_project nx-project.tar.gz
    - |
      ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
        -o StrictHostKeyChecking=yes "$PRODUCTION_DEPLOY_USER@$PRODUCTION_DEPLOY_HOST" \
        "deploy auto-ux $CI_COMMIT_SHA service" < nx-project.tar.gz
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PRODUCTION_DEPLOY_ENABLED == "1"'
  needs: [validate_project]

rollback_production:
  extends: .nx_deploy
  resource_group: "$CI_PROJECT_PATH_SLUG-production"
  environment:
    name: production
    url: $WOWDATA_PRODUCTION_URL
    deployment_tier: production
  script:
    - install -m 0600 "$PRODUCTION_DEPLOY_KEY" "$HOME/.ssh/id_ed25519"
    - printf '%s\n' "$PRODUCTION_DEPLOY_HOST_KEY" > "$HOME/.ssh/known_hosts"
    - chmod 0600 "$HOME/.ssh/known_hosts"
    - |
      if [ -n "${ROLLBACK_SHA:-}" ] && ! printf '%s\n' "$ROLLBACK_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
        echo 'ROLLBACK_SHA must be a full lowercase 40-character Git SHA.' >&2
        exit 2
      fi
    - |
      ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
        -o StrictHostKeyChecking=yes "$PRODUCTION_DEPLOY_USER@$PRODUCTION_DEPLOY_HOST" \
        "rollback auto-ux${ROLLBACK_SHA:+ $ROLLBACK_SHA}"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PRODUCTION_DEPLOY_ENABLED == "1"'
      when: manual
      allow_failure: false
